name: Hand input checks
on:
  pull_request:
    paths:
      - 'src/games/softServe.js'
      - 'src/input/handPointStabilizer.js'
      - 'src/maruMagic/**'
      - 'test/softServe.test.js'
      - 'test/handPointStabilizer.test.js'
      - 'test/maruMagic.test.js'
      - '.github/workflows/hand-input-check.yml'
permissions:
  contents: read
jobs:
  tests-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
