name: Camera Gesture Layer checks
on:
  pull_request:
    paths:
      - 'src/gesture/**'
      - 'test/gestureLayer.test.js'
      - 'test/gestureP1.test.js'
      - 'src/input/gripInput.js'
      - 'src/input/pinchInput.js'
      - 'src/pinch/view.js'
      - 'docs/CAMERA_GESTURE_P1_PROGRESS.md'
      - 'docs/gesture-layer-p0.md'
      - '.github/workflows/gesture-layer-p0.yml'
  push:
    branches: ['feat/camera-gesture-layer-p*']
    paths:
      - 'src/gesture/**'
      - 'test/gestureLayer.test.js'
      - 'test/gestureP1.test.js'
      - 'src/input/gripInput.js'
      - 'src/input/pinchInput.js'
      - 'src/pinch/view.js'
      - '.github/workflows/gesture-layer-p0.yml'
permissions:
  contents: read
jobs:
  gesture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
