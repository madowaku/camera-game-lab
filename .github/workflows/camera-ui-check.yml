name: Camera UI checks
on:
  pull_request:
    paths:
      - 'src/cameraUi/**'
      - 'src/maruMagic/core.js'
      - 'src/platform/feed.js'
      - 'test/cameraUi.test.js'
      - '.github/workflows/camera-ui-check.yml'
permissions:
  contents: read
jobs:
  camera-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Camera UI and MARU regression tests
        run: node --test test/cameraUi.test.js test/maruMagic.test.js
